name: 'Gemini PR Reviewer'
description: 'Automated AI code review for GitHub pull requests with exponential backoff and multi-model fallback.'
branding:
  icon: 'code'
  color: 'blue'

inputs:
  gemini-api-key:
    description: 'Google AI Studio Gemini API Key (optional when another free AI provider is enabled)'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for posting review comments'
    required: false
    default: ${{ github.token }}
  primary-model:
    description: 'Primary Gemini model to use'
    required: false
    default: 'gemini-3.8-flash'
  fallback-model:
    description: 'Fallback Gemini model(s) to try in order if primary is busy/unavailable (comma-separated list supported)'
    required: false
    default: 'gemini-3.6-flash,gemini-3.5-flash-lite'
  max-retries:
    description: 'Maximum retry attempts per model on transient errors before failing over'
    required: false
    default: '1'
  retry-delay:
    description: 'Base delay in seconds between retries'
    required: false
    default: '10'
  request-timeout:
    description: 'HTTP timeout in seconds for each API request'
    required: false
    default: '60'
  exclude-paths:
    description: 'Optional comma-separated extra glob patterns to exclude from PR diff review'
    required: false
    default: ''
  fallback-openai-base-url:
    description: 'Optional OpenAI-compatible API base URL for cross-provider fallback (e.g. Groq or OpenRouter)'
    required: false
    default: ''
  fallback-openai-api-key:
    description: 'Optional API key for the OpenAI-compatible fallback provider'
    required: false
    default: ''
  fallback-openai-model:
    description: 'Optional model name for the OpenAI-compatible fallback provider (e.g. openai/gpt-oss-120b)'
    required: false
    default: ''
  provider-order:
    description: 'Comma-separated priority order across enabled AI providers'
    required: false
    default: 'gemini,github-models,groq,openrouter,cerebras,mistral,custom-openai'
  enable-github-models:
    description: 'Enable GitHub Models free tier using github-token (requires permissions: models: read)'
    required: false
    default: 'false'
  github-models-model:
    description: 'Model(s) for GitHub Models provider (comma-separated)'
    required: false
    default: 'openai/gpt-4.1-mini'
  groq-api-key:
    description: 'Optional Groq API key for free-tier review/fallback'
    required: false
    default: ''
  groq-model:
    description: 'Model(s) for Groq provider (comma-separated)'
    required: false
    default: 'openai/gpt-oss-120b,llama-3.3-70b-versatile'
  openrouter-api-key:
    description: 'Optional OpenRouter API key for :free models'
    required: false
    default: ''
  openrouter-model:
    description: 'Model(s) for OpenRouter provider (comma-separated)'
    required: false
    default: 'qwen/qwen3-coder:free,deepseek/deepseek-r1:free'
  cerebras-api-key:
    description: 'Optional Cerebras API key'
    required: false
    default: ''
  cerebras-model:
    description: 'Model(s) for Cerebras provider (comma-separated)'
    required: false
    default: 'llama-3.3-70b'
  mistral-api-key:
    description: 'Optional Mistral API key'
    required: false
    default: ''
  mistral-model:
    description: 'Model(s) for Mistral provider (comma-separated)'
    required: false
    default: 'codestral-latest'
  review-mode:
    description: 'Multi-provider execution mode: fallback (default), consensus (feed secondary findings into synthesis + summary), or parallel (post separate review per provider)'
    required: false
    default: 'fallback'
  consensus-max-providers:
    description: 'Maximum number of enabled providers to query in consensus mode'
    required: false
    default: '3'
  main-reviewers:
    description: 'Number of primary AI reviewers to run on each PR (remaining enabled providers act as fallbacks or subagents)'
    required: false
    default: '2'
  extra-providers-mode:
    description: 'How to use enabled providers beyond main-reviewers: fallback (hold in reserve for failover) or subagents (run first and report findings to main reviewers)'
    required: false
    default: 'fallback'
  inline-comments:
    description: 'Enable exact line-by-line inline PR diff review comments'
    required: false
    default: 'true'
  pr-size-warn-lines:
    description: 'Changed source line threshold above which the review includes a PR size warning'
    required: false
    default: '800'
  pr-size-warn-files:
    description: 'Changed source file count threshold above which the review includes a PR size warning'
    required: false
    default: '12'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  bypass-keyword:
    description: 'Keyword in PR description to bypass strict linked-issue requirement'
    required: false
    default: 'BYPASS-LINK-ISSUE'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Google GenAI SDK
      shell: bash
      run: pip install google-genai

    - name: Generate PR Diff
      shell: bash
      run: |
        git fetch origin ${{ github.event.pull_request.base.ref }} --depth=100 2>/dev/null || true
        git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr_diff.txt 2>/dev/null || git diff HEAD~1 > pr_diff.txt
        git diff --stat origin/${{ github.event.pull_request.base.ref }}...HEAD > pr_diff_stat.txt 2>/dev/null || git diff --stat HEAD~1 > pr_diff_stat.txt

    - name: Run Gemini Code Review
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GEMINI_MODEL: ${{ inputs.primary-model }}
        GEMINI_FALLBACK_MODEL: ${{ inputs.fallback-model }}
        GEMINI_MAX_RETRIES: ${{ inputs.max-retries }}
        GEMINI_RETRY_DELAY: ${{ inputs.retry-delay }}
        GEMINI_REQUEST_TIMEOUT: ${{ inputs.request-timeout }}
        DIFF_FILE: pr_diff.txt
        DIFF_STAT_FILE: pr_diff_stat.txt
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        FALLBACK_OPENAI_BASE_URL: ${{ inputs.fallback-openai-base-url }}
        FALLBACK_OPENAI_API_KEY: ${{ inputs.fallback-openai-api-key }}
        FALLBACK_OPENAI_MODEL: ${{ inputs.fallback-openai-model }}
        PROVIDER_ORDER: ${{ inputs.provider-order }}
        ENABLE_GITHUB_MODELS: ${{ inputs.enable-github-models }}
        GITHUB_MODELS_MODEL: ${{ inputs.github-models-model }}
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
        GROQ_MODEL: ${{ inputs.groq-model }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
        CEREBRAS_API_KEY: ${{ inputs.cerebras-api-key }}
        CEREBRAS_MODEL: ${{ inputs.cerebras-model }}
        MISTRAL_API_KEY: ${{ inputs.mistral-api-key }}
        MISTRAL_MODEL: ${{ inputs.mistral-model }}
        REVIEW_MODE: ${{ inputs.review-mode }}
        CONSENSUS_MAX_PROVIDERS: ${{ inputs.consensus-max-providers }}
        MAIN_REVIEWERS: ${{ inputs.main-reviewers }}
        EXTRA_PROVIDERS_MODE: ${{ inputs.extra-providers-mode }}
        INLINE_COMMENTS: ${{ inputs.inline-comments }}
        PR_SIZE_WARN_LINES: ${{ inputs.pr-size-warn-lines }}
        PR_SIZE_WARN_FILES: ${{ inputs.pr-size-warn-files }}
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BYPASS_KEYWORD: ${{ inputs.bypass-keyword }}
      run: python ${{ github.action_path }}/gemini_review.py

    - name: Post Review Comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        PR_NUM="${{ github.event.pull_request.number }}"
        REPO="${{ github.repository }}"
        if [ -f review_outputs.json ]; then
          python3 - "$REPO" "$PR_NUM" <<'PY'
        import json
        import os
        import subprocess
        import sys

        repo, pr_num = sys.argv[1], sys.argv[2]
        with open("review_outputs.json", "r", encoding="utf-8") as f:
            entries = json.load(f)

        for entry in entries:
            payload_file = entry.get("payload_file", "")
            body_file = entry.get("file", "review_output.md")
            action = entry.get("action", "comment")
            slot = entry.get("slot_label", entry.get("display_name", "AI Reviewer"))
            print(f"Posting {slot} ({entry.get('used_model', '')}) with action={action}...")

            if payload_file and os.path.exists(payload_file):
                res = subprocess.run(
                    ["gh", "api", f"repos/{repo}/pulls/{pr_num}/reviews", "--method", "POST", "--input", payload_file],
                    check=False,
                )
                if res.returncode == 0:
                    continue
                print(f"Inline review API post failed for {slot}; falling back to gh pr review.")

            flag = "--approve" if action == "approve" else ("--request-changes" if action == "request-changes" else "--comment")
            res = subprocess.run(["gh", "pr", "review", pr_num, "-F", body_file, flag], check=False)
            if res.returncode != 0 and flag != "--comment":
                subprocess.run(["gh", "pr", "review", pr_num, "-F", body_file, "--comment"], check=True)
        PY
        else
          ACTION=$(cat review_action.txt 2>/dev/null || echo "comment")
          if [ "$ACTION" = "approve" ]; then
            echo "Review outcome: APPROVE"
            gh pr review "$PR_NUM" -F review_output.md --approve || \
            gh pr review "$PR_NUM" -F review_output.md --comment
          elif [ "$ACTION" = "request-changes" ]; then
            echo "Review outcome: REQUEST_CHANGES"
            gh pr review "$PR_NUM" -F review_output.md --request-changes || \
            gh pr review "$PR_NUM" -F review_output.md --comment
          else
            echo "Review outcome: COMMENT (neutral)"
            gh pr review "$PR_NUM" -F review_output.md --comment
          fi
        fi
